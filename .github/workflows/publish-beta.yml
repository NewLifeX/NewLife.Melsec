name: publish-beta

on:
  push:
    branches: [ master ]
    paths:
        - 'NewLife.Melsec/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> "$GITHUB_ENV"
    - name: Build
      run: dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.Melsec/NewLife.Melsec.csproj
    - name: Publish to GitHub Packages
      id: ghpackages
      continue-on-error: true
      run: dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      id: nuget
      run: dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
    - name: Publish Summary
      if: always()
      run: |
        {
          echo "### 发布结果"
          echo ""
          echo "| 渠道 | 结果 |"
          echo "| --- | --- |"
          echo "| GitHub Packages | ${{ steps.ghpackages.outcome }} |"
          echo "| NuGet.org | ${{ steps.nuget.outcome }} |"
        } >> "$GITHUB_STEP_SUMMARY"
